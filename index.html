<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="我的个人主页：关于我、我的兴趣和联系方式。" />
    <meta name="color-scheme" content="light dark" />
    <title>你的名字 · 个人主页</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="#home" aria-label="个人主页首页">
          <span class="brand-mark" aria-hidden="true">m.</span>
          <span>我的小天地</span>
        </a>
        <nav aria-label="主导航">
          <a href="#about">关于</a>
          <a href="#contact">联系</a>
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false" hidden>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.5 13.1A8.6 8.6 0 0 1 10.9 3.5 8.7 8.7 0 1 0 20.5 13.1Z" /></svg>
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </nav>
      </header>

      <main id="main">
        <section class="hero" id="home" aria-labelledby="hero-title">
          <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> 很高兴，在这里遇见你</p>
          <h1 id="hero-title">你好，<br />我是<span class="name">你的名字</span><span class="period">。</span></h1>
          <p class="hero-description">保持好奇，认真生活。<br />这是我的一小片互联网，记录热爱，也认识新朋友。</p>
          <a class="contact-link" href="#contact">和我打个招呼 <span aria-hidden="true">↗</span></a>
        </section>

        <section class="about section-grid" id="about" aria-labelledby="about-title">
          <h2 id="about-title"><span class="section-number">01</span> 关于我</h2>
          <div>
            <!-- 在这里替换成你自己的简介。 -->
            <p class="about-text">我喜欢探索新事物，也喜欢把复杂的事情慢慢想明白。工作之外，读书、散步和发现生活里的小细节，是我给自己充电的方式。</p>
            <ul class="interests" aria-label="我的兴趣">
              <li>阅读</li>
              <li>设计</li>
              <li>科技</li>
              <li>日常记录</li>
            </ul>
          </div>
        </section>

        <section class="contact section-grid" id="contact" aria-labelledby="contact-title">
          <h2 id="contact-title"><span class="section-number">02</span> 保持联系</h2>
          <div>
            <p class="contact-description">有一个想法，或只是想说声你好？欢迎写信给我。</p>
            <!-- 将链接和显示文字都替换成你的邮箱。 -->
            <a class="email-link" href="mailto:hello@example.com">hello@example.com <span aria-hidden="true">↗</span></a>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <span>© <span id="year">2026</span> 你的名字</span>
        <span>愿好奇心常在。</span>
      </footer>
    </div>
  </body>
</html>
